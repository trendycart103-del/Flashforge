
name: FlashForge Automatic APK Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashforge-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and Build APK

    runs-on: ubuntu-latest

    steps:

      # 1. Get latest GitHub repository files
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      # 2. Find ZIP automatically
      - name: Find Source ZIP
        shell: bash
        run: |
          echo "Searching for Android project ZIP..."

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*'
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only the correct project ZIP."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "SOURCE_ZIP=$GITHUB_WORKSPACE/$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

      # 3. Extract ZIP into a fresh directory
      - name: Extract Android Project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flashforge-source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/flashforge-source"

          echo "ZIP extraction successful"

      # 4. Find actual Android Gradle project
      - name: Locate Android Project
        shell: bash
        run: |
          mapfile -t PROJECT_FILES < <(
            find "$RUNNER_TEMP/flashforge-source" \
              -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \)
          )

          if [ "${#PROJECT_FILES[@]}" -eq 0 ]; then
            echo "::error::Gradle project not found inside ZIP"
            exit 1
          fi

          if [ "${#PROJECT_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple Gradle projects found. Project selection needs clarification."
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # 5. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install required Android SDK
      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 8. Setup Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. Restore persistent Debug Signing Key
      - name: Restore Debug Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"

            echo "$KEYSTORE_B64" | base64 --decode \
              > "$HOME/.android/debug.keystore"

            echo "Persistent signing key restored"
          else
            echo "::warning::Persistent signing key not configured. A default debug key may be generated."
          fi

      # 10. Verify Android project
      - name: Verify Project Files
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found"
            exit 1
          fi

          echo "Android app module verified"

      # 11. Clean and build a fresh APK
      - name: Clean and Compile APK
        run: |
          cd "$PROJECT_DIR"

          gradle --version

          gradle clean :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      # 12. Find and collect newly built APK
      - name: Collect Fresh APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          mapfile -t APK_FILES < <(
            find "$PROJECT_DIR/app/build/outputs/apk/debug" \
              -type f -name '*.apk' 2>/dev/null
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::New APK was not generated"
            exit 1
          fi

          APK="${APK_FILES[0]}"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/FlashForge-debug.apk"

          echo "New APK collected:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/FlashForge-debug.apk"

      # 13. Upload APK to GitHub Actions
      - name: Upload Fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-APK-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/FlashForge-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Build summary
      - name: Build Summary
        if: success()
        run: |
          echo "## FlashForge APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP extracted successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fresh Android APK compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK uploaded as GitHub Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
