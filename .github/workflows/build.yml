name: FlashForge Android Build

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build FlashForge
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java Environment
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Locate ZIP Project
      - name: Locate FlashForge ZIP
        run: |
          echo "Searching for FlashForge.zip..."

          if [ -f "FlashForge.zip" ]; then
            echo "ZIP found in repository root."
          else
            echo "ERROR: FlashForge.zip not found!"
            exit 1
          fi

      # 4. Extract Android Project
      - name: Extract FlashForge Project
        run: |
          mkdir -p extracted_project

          unzip -q FlashForge.zip -d extracted_project

          echo "ZIP extraction completed."

          find extracted_project -maxdepth 3 -type f | head -100

      # 5. Locate Project Root
      - name: Detect Android Project Root
        run: |
          PROJECT_ROOT=""

          if [ -f "extracted_project/gradlew" ]; then
            PROJECT_ROOT="extracted_project"
          else
            PROJECT_ROOT=$(find extracted_project -type f \
              \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

          echo "Android project root:"
          echo "$PROJECT_ROOT"

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Build Android Application
      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "Starting Android Build..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            echo "Using Gradle Wrapper"

            ./gradlew clean assembleDebug --no-daemon

          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle."

            gradle clean assembleDebug --no-daemon
          fi

      # 8. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "Searching for APK files..."

          find . -type f -name "*.apk"

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK build successful!"

      # 9. Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-APK
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Upload Build Reports
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-Build-Reports
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
