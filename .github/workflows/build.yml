
name: FlashForge Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build FlashForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP File
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILES=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip")

          ZIP_COUNT=$(echo "$ZIP_FILES" | \
            grep -c "." || true)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            echo "Keep only one ZIP in repository root."
            exit 1
          fi

          ZIP_FILE=$(echo "$ZIP_FILES" | head -n 1)

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Selected ZIP:"
          echo "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction successful."

      - name: Locate Gradle Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=$(find \
            "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print \
            -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app Gradle file missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project detected:"
          echo "$PROJECT_DIR"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Build Environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Gradle Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.49-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/
          if-no-files-found: ignore
          retention-days: 14
