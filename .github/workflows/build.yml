name: Build FlashForge APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (auto-extract zip if needed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Project files found in repository root."
          else
            ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | sort | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No project files and no .zip found in the repository."
              exit 1
            fi
            echo "Extracting: $ZIP"
            rm -rf "$RUNNER_TEMP/project"
            mkdir -p "$RUNNER_TEMP/project"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
            SETTINGS=$(find "$RUNNER_TEMP/project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/__MACOSX/*' | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle(.kts) not found inside the zip."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show errors in job summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build errors"
            echo "~~~"
            grep -nE '^e: |error:|What went wrong|Execution failed|Could not |Unresolved|not found|FAILED' "$RUNNER_TEMP/build.log" | head -n 60 || true
            echo "~~~"
            echo "## Last 40 lines"
            echo "~~~"
            tail -n 40 "$RUNNER_TEMP/build.log" || true
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
