
name: FlashForge Automatic APK Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashforge-apk-build
  cancel-in-progress: true

env:
  SOURCE_ZIP: FlashForge_UI_Kit_Updated_v1.44.zip

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download latest repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify ZIP file
      - name: Verify Source ZIP
        run: |
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP"
            exit 1
          fi

          echo "Source ZIP found"
          ls -lh "$SOURCE_ZIP"

      # 3. Extract ZIP into a clean directory
      - name: Extract Android Project
        run: |
          mkdir -p "$RUNNER_TEMP/flashforge-source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/flashforge-source"

          echo "ZIP extraction completed"

          find "$RUNNER_TEMP/flashforge-source" \
            -name settings.gradle.kts \
            -o -name settings.gradle

      # 4. Locate actual Gradle project
      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find \
            "$RUNNER_TEMP/flashforge-source" \
            -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle project not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # 5. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 7. Install Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Restore stable debug signing key if configured
      - name: Restore Stable Debug Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 --decode \
              > "$HOME/.android/debug.keystore"
            echo "Stable debug signing key restored"
          else
            echo "::warning::No persistent debug keystore configured"
          fi

      # 9. Build a completely fresh APK
      - name: Clean and Compile APK
        run: |
          cd "$PROJECT_DIR"

          gradle --version

          gradle clean :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      # 10. Collect newly generated APK
      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/FlashForge-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/FlashForge-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      # 11. Upload APK as GitHub Artifact
      - name: Upload Fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-APK-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/FlashForge-debug.apk
          if-no-files-found: error
          retention-days: 30
