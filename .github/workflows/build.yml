
name: Extract ZIP and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' ! -path '*/unpacked/*' | sort)

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No project ZIP found!"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "More than one ZIP found. Keep only one project ZIP."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          EXTRACT_DIR="$GITHUB_WORKSPACE/unpacked"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle project not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app module not found!"
            exit 1
          fi

          PROJECT_REL="$(realpath --relative-to="$GITHUB_WORKSPACE" "$PROJECT_DIR")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "project_rel=$PROJECT_REL" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path not found!"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        run: |
          gradle -p "${{ steps.locate.outputs.project_dir }}" clean testDebugUnitTest lintDebug assembleDebug --no-build-cache --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-APK
          path: |
            ${{ steps.locate.outputs.project_rel }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.locate.outputs.project_rel }}/app/build/reports/tests/testDebugUnitTest/**
            ${{ steps.locate.outputs.project_rel }}/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
