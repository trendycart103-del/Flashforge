
name: FlashForge ZIP Extract and Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Compile Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify uploaded ZIP
      - name: Verify FlashForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "FlashForge.zip" ]; then
            echo "::error::FlashForge.zip was not found in repository root."
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t FlashForge.zip

      # 3. Extract complete ZIP
      - name: Extract FlashForge Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -q FlashForge.zip -d extracted

          if [ -f "extracted/project/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted/project"
          elif [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted"
          else
            echo "::error::Gradle project was not found after extraction."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully."
          echo "Project directory: $PROJECT_DIR"

      # 4. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 5. Install Gradle 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install required SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 8. Verify Gradle project configuration
      - name: Verify Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle projects --stacktrace

      # 9. Run Unit Tests
      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle testDebugUnitTest --stacktrace

      # 10. Run Android Lint
      - name: Run Android Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle lintDebug --stacktrace

      # 11. Build Debug APK
      - name: Build FlashForge Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      # 12. Verify APK output
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      # 13. Upload APK and reports
      - name: Upload FlashForge Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.48-Android-Build
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/app/build/reports/tests/testDebugUnitTest/**
            extracted/**/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
