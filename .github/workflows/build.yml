
name: Build and verify FlashForge

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FlashForge Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify ZIP File
      - name: Verify FlashForge ZIP
        run: |
          if [ ! -f "FlashForge.zip" ]; then
            echo "ERROR: FlashForge.zip was not found in repository root."
            exit 1
          fi

          unzip -t FlashForge.zip

      # 3. Extract Complete Project
      - name: Extract FlashForge Project
        run: |
          mkdir -p extracted
          unzip -q FlashForge.zip -d extracted

          if [ -f "extracted/project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/project" >> "$GITHUB_ENV"

          elif [ -f "extracted/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

          else
            echo "ERROR: Gradle project was not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

      # 4. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Setup Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Setup Android SDK - Fixed
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 7. Install Required Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          echo "Installing Android SDK packages..."

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Checking installed SDK packages..."
          sdkmanager --list_installed

          echo "Android SDK installation completed."

      # 8. Verify Gradle Project
      - name: Verify Gradle Project
        run: |
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          gradle projects --stacktrace

      # 9. Run Tests, Lint and Build APK
      - name: Build FlashForge Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle clean \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            --no-build-cache \
            --stacktrace

      # 10. Verify APK
      - name: Verify APK
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # 11. Upload APK and Reports
      - name: Upload FlashForge Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.48-Android-Build
          path: |
            extracted/**/app/build/outputs/apk/**/*.apk
            extracted/**/app/build/reports/**
            extracted/**/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
